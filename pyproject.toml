[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "virgent"
version = "0.1.0"
description = "Auditable, provenance-first security agent framework for enterprise product-development environments"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Virgent Contributors" }]
keywords = ["security", "audit", "provenance", "compliance", "agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
llm = ["anthropic>=0.100.0"]
dev = ["pytest>=8.0", "anthropic>=0.100.0"]

[project.scripts]
virgent = "virgent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
