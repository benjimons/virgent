name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e '.[dev]'
      - name: Test
        run: pytest -v
      - name: Smoke-test CLI (offline, tamper-evidence)
        run: |
          export VIRGENT_AUDIT_KEY=ci-smoke-key
          mkdir -p /tmp/demo && printf 'FROM ubuntu:latest\n' > /tmp/demo/Dockerfile
          virgent --workdir /tmp/wd init
          virgent --workdir /tmp/wd ingest /tmp/demo
          virgent --workdir /tmp/wd scan
          virgent --workdir /tmp/wd report --format json -o /tmp/report.json
          virgent --workdir /tmp/wd audit verify
